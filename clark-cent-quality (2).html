<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clark Cent Quality</title>
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#0a0a0a;
    --border:#242424;
    --text:#f5f5f5;
    --muted:#9a9a9a;
    --muted-dim:#6f6f6f;
    --cyan:#5fd6dd;
    --blue:#3d4bd6;
    --blue-hover:#4a58e6;
    --green:#1f9d55;
    --green-bg:rgba(31,157,85,0.14);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* NAV */
  nav{
    display:flex;
    align-items:center;
    gap:28px;
    padding:16px 32px;
    border-bottom:1px solid var(--border);
  }
  .avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    background:#1a1a1a;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .wordmark{
    font-weight:600;
    font-size:15px;
    letter-spacing:0.2px;
    margin-right:4px;
    color:var(--text);
  }
  .nav-link{
    font-size:15px;
    color:var(--text);
    opacity:0.92;
  }
  .nav-link:hover{opacity:1;}

  /* MAIN */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:56px 32px 96px;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,0.86fr);
    gap:56px;
    align-items:start;
  }

  .hero{
    position:relative;
    border-radius:2px;
    overflow:hidden;
    background:#111;
    aspect-ratio:1/1;
  }
  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .hero-overlay{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:28px 26px 30px;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0.55) 55%,rgba(0,0,0,0.72) 100%);
  }
  .hero-overlay h2{
    margin:0;
    font-size:clamp(28px,4vw,42px);
    line-height:1.04;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .hero-overlay .line1{color:#eaeaea;}
  .hero-overlay .line2{color:var(--cyan);}

  .panel{padding-top:4px;}

  .badge{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    color:var(--green);
    background:var(--green-bg);
    border:1px solid rgba(31,157,85,0.35);
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:18px;
  }

  h1.title{
    margin:0 0 24px;
    font-size:clamp(30px,3vw,38px);
    line-height:1.12;
    font-weight:700;
    letter-spacing:-0.3px;
  }

  .download-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--blue);
    color:#fff;
    font-size:16px;
    font-weight:600;
    padding:15px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .download-btn:hover{background:var(--blue-hover);}

  .wishlist{
    display:inline-block;
    margin-top:16px;
    font-size:14px;
    color:var(--muted);
    border-bottom:1px solid var(--muted-dim);
    padding-bottom:1px;
  }
  .wishlist:hover{color:var(--text);}

  hr.divider{
    border:none;
    border-top:1px solid var(--border);
    margin:28px 0;
  }

  .intro{
    font-size:16px;
    font-weight:700;
    margin:0 0 6px;
  }
  .includes-label{
    font-size:15px;
    font-weight:600;
    margin:0 0 14px;
    border-bottom:1px solid var(--muted-dim);
    display:inline-block;
    padding-bottom:2px;
  }

  ul.includes{
    list-style:none;
    margin:0 0 26px;
    padding:0;
  }
  ul.includes li{
    position:relative;
    padding-left:18px;
    margin-bottom:10px;
    font-size:15px;
    color:#e6e6e6;
    line-height:1.4;
  }
  ul.includes li::before{
    content:"";
    position:absolute;
    left:0;
    top:8px;
    width:6px;
    height:6px;
    background:var(--cyan);
  }
  ul.includes li strong{font-weight:700;color:#fff;}

  .requirement{
    font-size:13.5px;
    color:var(--muted);
    margin:0;
    line-height:1.5;
  }

  /* FOOTER */
  footer{
    border-top:1px solid var(--border);
    padding:44px 32px 56px;
    text-align:center;
  }
  footer .footer-label{
    font-size:13px;
    color:var(--muted-dim);
    margin:0 0 16px;
  }
  .contact-links{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .contact-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    transition:border-color 0.15s ease,background 0.15s ease;
  }
  .contact-link:hover{
    border-color:#3a3a3a;
    background:#131313;
  }
  .contact-link svg{width:17px;height:17px;flex-shrink:0;}

  @media (max-width:820px){
    main{grid-template-columns:1fr;gap:32px;padding:36px 20px 72px;}
    nav{padding:14px 20px;}
  }
</style>
</head>
